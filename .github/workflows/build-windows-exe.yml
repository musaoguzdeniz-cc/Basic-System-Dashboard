name: Build Windows Rust EXE

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/build-windows-exe.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Rust source
        run: cargo check --locked

      - name: Build executable
        run: cargo build --release --locked

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemResourceWidget-Windows-Rust
          path: target/release/SystemResourceWidget.exe

      - name: Update executable in release folder
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/SystemResourceWidget.exe release/SystemResourceWidget.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/SystemResourceWidget.exe
          if (git diff --cached --quiet) {
            Write-Host "Executable is unchanged."
            exit 0
          }
          git commit -m "Build Rust Windows executable"
          git push